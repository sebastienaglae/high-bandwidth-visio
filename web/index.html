<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1814" />
    <meta name="description" content="Private high-bandwidth video meetings with minimal relay latency." />
    <meta property="og:title" content="Visio — private high-bandwidth video meetings" />
    <meta property="og:description" content="Meet through your own low-latency relay infrastructure." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/visio-mark.svg" />
    <title>visio</title>
    <link rel="icon" href="/visio-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply saved theme before first paint.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("visio:theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
